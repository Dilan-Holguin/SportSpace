# Public-host overlay. Local demo stays `docker compose up --build`.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# Requires a .env with unique JWT secrets, a non-default DB/admin password,
# and WEB_ORIGIN set to the public origin (https://your-host, no trailing slash).
# NODE_ENV=production enables Secure refresh cookies: serve the site over HTTPS.

services:
  postgres:
    ports: !reset []

  api:
    environment:
      NODE_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the public https origin (no trailing slash)}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET to a unique value}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET to a unique value}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD (do not use Admin1234 on a public host)}
    ports: !reset []

  web:
    ports: !override
      - "${WEB_PUBLISH_PORT:-80}:80"
